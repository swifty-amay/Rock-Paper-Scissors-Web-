<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper & Scissor</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>Select your choice</h1>
        <div class="btn-container">
            <button id="rock" class="btn">Rock</button>
            <button id="paper" class="btn">Paper</button>
            <button id="scissor" class="btn">Scissor</button>
        </div>
    </div>
    <div class="result">
        <h2>RESULT</h2>
        <h4 id="round-result"></h4>
        <div class="result-info">
            <p id="c-choice">Computer's Choice: </p>
            <p id="h-choice">Your Choice: </p>
            <p id="c-score">Computer's Score: </p>
            <p id="h-score">Your Score: </p>
        </div>
    </div>
    <script src="./game.js">
    </script>
</body>

</html>
